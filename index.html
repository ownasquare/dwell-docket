<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find detention owed, recovered, and blocked by missing evidence from one local stop CSV."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Dwell Docket — Find detention gaps</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <path d="M10 11h28v26H10z" />
            <path d="M16 18h16M16 24h10M16 30h7" />
            <path d="m29 29 3 3 6-8" />
          </svg>
        </div>
        <p class="eyebrow">Local stop reconciliation</p>
        <h1 id="page-title">Find detention money your stop report missed.</h1>
        <p class="lede">
          Drop one CSV. Get a clear docket of what was recovered, what may still
          be owed, and what needs better proof.
        </p>
      </section>

      <section class="task-card" aria-label="Create a detention docket">
        <label class="drop-zone" id="drop-zone" for="stop-file">
          <input id="stop-file" type="file" accept=".csv,text/csv" />
          <span class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v5h14v-5" />
            </svg>
          </span>
          <span class="drop-title" id="drop-title">Drop one stop CSV</span>
          <span class="drop-hint" id="drop-hint">or choose a file</span>
        </label>

        <button class="primary-action" id="run" type="button" disabled>
          <span>Find detention gaps</span>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m9 5 7 7-7 7" />
          </svg>
        </button>

        <p class="privacy-note">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v10H5z" />
          </svg>
          Nothing leaves this browser.
        </p>

        <div class="status" id="status" role="status" aria-live="polite"></div>
        <section
          class="result"
          id="result"
          aria-labelledby="result-title"
          hidden
        ></section>
      </section>

      <p class="scope-note">
        Calculations support review; your rate confirmation decides eligibility.
      </p>
    </main>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
